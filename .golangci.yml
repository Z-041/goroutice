version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard # 以官方默认集为基线（errcheck, govet, ineffassign, staticcheck, unused）
  enable:
    # --- Bug 与错误处理 ---
    - bodyclose # HTTP 响应体必须关闭
    - contextcheck # context.Context 用法正确性
    - errorlint # 错误比较用 errors.Is / errors.As
    - errname # 哨兵错误命名必须形如 ErrXxx
    - nilerr # 错误不为 nil 却返回 nil
    - nilnil # 不允许同时返回 nil 错误与 nil 值
    - noctx # 网络/命令调用必须带 context 或超时（测试文件中关闭，见 exclusions）
    - rowserrcheck # 检查 sql.Rows.Err() 是否被处理
    - sqlclosecheck # 检查 sql 资源是否关闭

    # --- 安全 ---
    - gosec # 安全漏洞模式检测

    # --- 风格与一致性 ---
    - copyloopvar # 循环变量捕获（Go 1.22+ 后不再需要显式复制）
    - dupword # 注释/字符串里的重复单词
    - intrange # 整数循环用 for range n（Go 1.22+）
    - misspell # 拼写检查
    - nolintlint # //nolint 必须说明原因、指明 linter，且不得失效
    - revive # 可配置的代码规范检查
    - unconvert # 不必要的类型转换
    - usestdlibvars # 常量优先用标准库定义（http.MethodGet 等）
    - wastedassign # 无效赋值
    - whitespace # 多余空行

    # --- 复杂度与可维护性 ---
    - gocyclo # 圈复杂度
    - goconst # 重复字符串提取为常量
    - gocritic # 覆盖较广的 bug 与风格检查
    - perfsprint # 可避免的 fmt 格式化为性能问题
    - prealloc # 能预分配容量的切片
    - unparam # 未被用到的参数或恒定实参

    # 刻意未启用：
    #   cyclop / gocognit —— 与 gocyclo 职责重叠，同一条超复杂函数会被报 3 次。
    #   funlen —— 命中的全是 newApp / router.New / setDefaults 这类「装配」函数，
    #             它们的长度来自接线项数量，拆开只会制造更碎的间接层。
    #   testpackage / paralleltest —— 测试有意与被测代码同包（要测未导出符号）。
  exclusions:
    rules:
      # 测试文件中放宽复杂度、安全与 ctx 相关限制
      - path: _test\.go
        linters:
          - gocyclo
          - gosec
          - errcheck
          - goconst
          - noctx # httptest.NewRequest 不带 ctx，对 handler 单测没有意义
      # QF1008 建议把 db.Dialector.Name() 简写成 db.Name()。这里保留显式写法：
      # 「取 Dialector 的名字」比含义不明的 Name() 更能说明在判断什么。
      # 用豁免而不是重设 staticcheck.checks，避免连带上默认关闭的 ST 系列检查。
      - text: QF1008
        linters:
          - staticcheck
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: exported
          disabled: false
    nolintlint:
      require-explanation: true # 必须写成 //nolint:linter // 原因
      require-specific: true # 禁止不带 linter 名的裸 //nolint

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0 # 不限制单个 linter 的问题数量
  max-same-issues: 0 # 不限制同类问题的数量
  new: false # 保持全量检查：CI 也跑全量，避免历史问题被「只报新增」长期掩盖

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
